<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>My Showcase Website</title>
</head>

<body>

    <!-- The Hero Section -------------------------------------------------------------------------------------- -->
    <section class="hero">
        <div class="hero-text">Adyan's Year 10 Portfolio</div>
    </section>

<!-- Image Editing -->
<section class="topic">
    <div class="topic-title">
        <h1>Image Editing</h1>
    </div>

    <div class="topic-content">
        <div class="topic-card">
            <img src="images/Penguin.png" alt="Penguin Image">
            <h2 class="topic-card-text">Penguin Image</h2>
        </div>

        <div class="topic-card">
            <img src="images/Character.png" alt="Character Image">
            <h2 class="topic-card-text">Character Image</h2>
        </div>

        <div class="topic-card">
            <img src="images/Snow flakes.png" alt="Snow Flakes Image">
            <h2 class="topic-card-text">Snow Flakes Image</h2>
        </div>
    </div>
</section>


<!-- Blender -->
<section class="topic">
    <div class="topic-title">
        <h1>Blender</h1>
    </div>

    <div class="topic-content">
        <div class="topic-card">
            <img src="images/Chest.png" alt="Chest Image">
            <h2 class="topic-card-text">Chest Image</h2>
        </div>

        <div class="topic-card">
            <img src="images/Snowman.png" alt="Snowman Image">
            <h2 class="topic-card-text">Snow Man Image</h2>
        </div>
    </div>
</section>


<!-- Design and Manufacturing -->
<section class="topic">
    <div class="topic-title">
        <h1>Design and Manufacturing</h1>
    </div>

    <div class="topic-content">
        <div class="topic-card">
            <img src="images/Car.png" alt="3D Printed Car">
            <h2 class="topic-card-text">3D Printed Car Image</h2>
        </div>

        <div class="topic-card">
            <img src="images/Cookie Cutter.png" alt="3D Printed Cookie Cutter">
            <h2 class="topic-card-text">3D Printed Cookie Cutter Image</h2>
        </div>
    </div>
</section>

<!-- Game Design -->
<section class="topic">
    <div class="topic-title">
        <h1>Game Design</h1>
    </div>

    <div class="topic-content">
        <div class="topic-card">
            <iframe 
                frameborder="0" 
                src="https://itch.io/embed/4966766" 
                width="552" 
                height="167">
                <a href="https://adyan-hasan.itch.io/wave-defence">
                    Wave Defense by Adyan_Hasan
                </a>
            </iframe>
        </div>
    </div>
</section>    

    <!-- A Simple Website Footer ------------------------------------------------------------------------------ -->
    <footer class="footer">
        <p>&copy; 2026 My Showcase Website By Adyan Hasan</p>
    </footer>

</body>
</html>
